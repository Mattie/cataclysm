[tool.poetry]
name = "cataclysm"
version = "0.1.2"
description = "The Last Library"
authors = ["Mattie Casper"]
license = "MIT"
readme = "README.md"
include = ["cataclysm/default_files/**"]
exclude = ["examples/**", "tests/**"]

[tool.poetry.dependencies]
python = "^3.10"
chatsnack = { git = "https://github.com/Mattie/chatsnack.git", rev = "630ea4b5ce76b163833ad7c0b8d03072ec95d5a6" }
loguru = "^0.6.0"
datafiles = "^2.1"
"ruamel.yaml" = ">=0.18.10,<0.20.0"

[tool.poetry.scripts]
cataclysm = "cataclysm.__main__:main"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"

[tool.pytest.ini_options]
markers = [
    "live: requires OPENAI_API_KEY and CATACLYSM_RUN_LIVE_TESTS=1",
    "notebooks: notebook-derived tests",
    "notebooks_live: live notebook cells that require OPENAI_API_KEY and CATACLYSM_RUN_LIVE_TESTS=1",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
