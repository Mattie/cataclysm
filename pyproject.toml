[tool.poetry]
name = "cataclysm"
version = "0.1.2"
description = "The Last Library"
authors = ["Mattie Casper"]
license = "MIT"
readme = "README.md"
include = ["default_files/**"]
exclude = ["examples/**", "tests/**"]

[tool.poetry.dependencies]
python = "^3.10"
plunkylib = "^0.1.4"
loguru = "^0.6.0"
openai = "^0.27.2"
datafiles = "^2.1"

# Wheel installs do not use poetry.lock, so enforce the security fixes here too.
aiohttp = ">=3.14.4,<4.0"
requests = ">=2.33.0,<3.0"
urllib3 = ">=2.8.0,<3.0"
certifi = ">=2026.10.19"
idna = ">=3.15,<4.0"
python-dotenv = ">=1.2.2,<2.0"
tqdm = ">=4.66.3,<5.0"
multidict = ">=6.9.1,<8.0"

[tool.poetry.scripts]
cataclysm = "cataclysm.__main__:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
